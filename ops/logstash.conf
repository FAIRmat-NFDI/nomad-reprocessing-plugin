# Logstash pipeline for viewing NOMAD reprocessing logs in Kibana.
#
# NOMAD's structured logger ships events over TCP (python-logstash, newline
# delimited JSON) when `logstash.enabled` is set in nomad.yaml. This pipeline
# receives them and writes to a daily `nomad-logs-*` index in Elasticsearch.
#
# Override the Elasticsearch target with the ES_HOSTS environment variable; the
# default assumes Logstash shares the deployment's Docker network with the
# Elasticsearch service reachable as `elastic`.

input {
  tcp {
    port => 5000
    codec => json_lines
  }
}

output {
  elasticsearch {
    hosts => ["${ES_HOSTS:http://elastic:9200}"]
    index => "nomad-logs-%{+YYYY.MM.dd}"
  }
}
